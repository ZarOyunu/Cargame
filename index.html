<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NovaGo Hub | Ege</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --navbar-bg: #171821;
            --card-bg: #222330;
            --accent-color: #00ff88;
            --text-main: #ffffff;
            --text-muted: #a0a4b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Mobilde yazıları seçmeyi engelle */
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; /* Oyun için kaydırmayı kapat */
        }

        /* --- HUB ARAYÜZÜ (ROBLOX STİLİ) --- */
        #hub-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            position: absolute;
            top: 0; left: 0;
            z-index: 10;
            background-color: var(--bg-color);
            transition: opacity 0.5s;
        }

        .navbar {
            background-color: var(--navbar-bg);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a2b38;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #00ff88, #00b8ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #000;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--card-bg);
            padding: 5px 15px 5px 5px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid var(--accent-color);
        }

        .avatar {
            width: 35px;
            height: 35px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .main-container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-color);
        }

        .game-thumbnail {
            width: 100%;
            height: 160px;
            background: #2a2b38;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            position: relative;
        }

        .play-btn-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: var(--accent-color);
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .game-card:hover .play-btn-overlay {
            transform: translate(-50%, -50%) scale(1);
        }

        .game-info {
            padding: 20px;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .game-developer {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* --- OYUN EKRANI VE KONTROLLER --- */
        #game-container {
            width: 100%;
            height: 100%;
            display: none; /* Başlangıçta gizli */
            position: absolute;
            top: 0; left: 0;
            z-index: 20;
            background-color: #000;
        }

        /* Sunucuya Katılma Ekranı */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 16, 21, 0.95);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #2a2b38;
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        #loading-text {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
        }

        #server-logs {
            margin-top: 15px;
            font-family: monospace;
            color: var(--text-muted);
            text-align: center;
            font-size: 14px;
            max-width: 400px;
        }

        /* Mobil Butonlar */
        .mobile-controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 40;
            pointer-events: none; /* Konteyner tıklanmasın, butonlar tıklansın */
        }

        .control-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: background-color 0.2s, transform 0.1s;
        }

        .control-btn:active {
            background-color: rgba(0, 255, 136, 0.4);
            border-color: var(--accent-color);
            transform: scale(0.9);
        }

        #btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            z-index: 40;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Oyun İçi Chat / Oyuncu Listesi Simülasyonu */
        #game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 40;
            pointer-events: none;
        }

        .player-list {
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-list span { color: var(--accent-color); font-weight: bold; }

    </style>
</head>
<body>

    <div id="hub-container">
        <nav class="navbar">
            <div class="brand-container">
                <div class="logo">NG</div>
                <div class="brand-name">NovaGo Hub</div>
            </div>
            
            <div class="user-profile">
                <div class="avatar">E</div>
                <span>Ege</span>
            </div>
        </nav>

        <main class="main-container">
            <h2 class="section-title">🔥 Öne Çıkan Deneyimler</h2>
            
            <div class="games-grid">
                <div class="game-card" onclick="joinServer()">
                    <div class="game-thumbnail">
                        🌍
                        <div class="play-btn-overlay">▶</div>
                    </div>
                    <div class="game-info">
                        <div class="game-title">Ege'nin 3D Dünyası</div>
                        <div class="game-developer">Geliştirici: Ege</div>
                        <div style="color: var(--accent-color); margin-top: 10px; font-weight: bold;">
                            🟢 Sunucu Çevrimiçi - Tıkla ve Katıl
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-container">
        <div id="loading-screen">
            <div class="spinner"></div>
            <div id="loading-text">Sunucuya Bağlanılıyor...</div>
            <div id="server-logs">
                <p>Uzak sunucu IP'si aranıyor...</p>
            </div>
        </div>

        <div id="canvas-container" style="width: 100%; height: 100%;"></div>

        <div id="game-ui" style="display: none;">
            <div class="player-list">
                👥 Çevrimiçi Oyuncular:<br>
                - <span>Ege</span> (Sen)<br>
                - <span>NovaOyuncu_99</span>
            </div>
        </div>

        <button id="btn-exit" style="display: none;" onclick="exitGame()">Oyundan Çık</button>

        <div class="mobile-controls" id="mobile-controls" style="display: none;">
            <div class="control-btn" id="btn-forward">⬆️</div>
            <div class="control-btn" id="btn-jump">⏫</div>
        </div>
    </div>

    <script>
        // DOM Elementleri
        const hubContainer = document.getElementById("hub-container");
        const gameContainer = document.getElementById("game-container");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingText = document.getElementById("loading-text");
        const serverLogs = document.getElementById("server-logs");
        const mobileControls = document.getElementById("mobile-controls");
        const btnExit = document.getElementById("btn-exit");
        const gameUI = document.getElementById("game-ui");

        // Kontrol Değişkenleri
        let moveForward = false;
        let doJump = false;
        let gameActive = false;

        // Three.js Değişkenleri
        let scene, camera, renderer;
        let player, ground;
        
        // Fizik Değişkenleri
        let velocityY = 0;
        let gravity = -0.015; // Düşme (Yerçekimi) gücü
        let jumpPower = 0.35; // Zıplama gücü
        let isGrounded = false;
        let moveSpeed = 0.15;

        let animationId;

        // --- SUNUCUYA KATILMA SİMÜLASYONU ---
        function joinServer() {
            hubContainer.style.display = "none";
            gameContainer.style.display = "block";
            loadingScreen.style.display = "flex";
            
            // Log simülasyonu
            setTimeout(() => { addLog("Kimlik doğrulanıyor (Ege)..."); }, 800);
            setTimeout(() => { addLog("Dünya verileri indiriliyor..."); }, 1600);
            setTimeout(() => { addLog("Fizik motoru başlatılıyor..."); }, 2400);
            setTimeout(() => { 
                loadingText.innerText = "Sunucuya Katılındı!";
                loadingText.style.color = "#ffffff";
            }, 3000);
            
            setTimeout(() => {
                loadingScreen.style.display = "none";
                mobileControls.style.display = "flex";
                btnExit.style.display = "block";
                gameUI.style.display = "block";
                startGameEngine();
            }, 3500);
        }

        function addLog(text) {
            const p = document.createElement("p");
            p.innerText = text;
            serverLogs.appendChild(p);
        }

        function exitGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            document.getElementById("canvas-container").innerHTML = ""; // Canvas'ı temizle
            
            gameContainer.style.display = "none";
            mobileControls.style.display = "none";
            btnExit.style.display = "none";
            gameUI.style.display = "none";
            hubContainer.style.display = "block";
            
            // Logları sıfırla
            serverLogs.innerHTML = "<p>Uzak sunucu IP'si aranıyor...</p>";
            loadingText.innerText = "Sunucuya Bağlanılıyor...";
            loadingText.style.color = "var(--accent-color)";
        }

        // --- THREE.JS 3D OYUN MOTORU VE FİZİK ---
        function startGameEngine() {
            gameActive = true;
            const container = document.getElementById("canvas-container");

            // 1. Sahne (Scene)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Gökyüzü mavisi
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // Uzaklık sisi

            // 2. Kamera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8); // Oyuncunun arkasında

            // 3. Render Motoru
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Zemin (Ground)
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 }); // Çimen yeşili
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2; // Yere yatır
            ground.receiveShadow = true;
            scene.add(ground);

            // Zemin Izgarası (Grid)
            const gridHelper = new THREE.GridHelper(100, 100, 0x000000, 0x000000);
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // 6. Oyuncu (Karakter - Ege)
            const playerGeo = new THREE.BoxGeometry(1, 2, 1); // İnsan boyutuna yakın bir kutu
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 10; // Havadan doğsun (Düşme animasyonu için yüksekten bırakıyoruz)
            player.castShadow = true;
            scene.add(player);

            // Rastgele Engeller/Platformlar (Dünya dolu gözüksün)
            for(let i=0; i<20; i++) {
                const boxSize = Math.random() * 2 + 1;
                const bGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
                const bMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                const bMesh = new THREE.Mesh(bGeo, bMat);
                bMesh.position.x = (Math.random() - 0.5) * 40;
                bMesh.position.z = (Math.random() - 0.5) * 40 - 10;
                bMesh.position.y = boxSize / 2;
                bMesh.castShadow = true;
                bMesh.receiveShadow = true;
                scene.add(bMesh);
            }

            // Yeniden boyutlandırma dinleyicisi
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        // --- MOBİL BUTON KONTROLLERİ ---
        const btnFwd = document.getElementById("btn-forward");
        const btnJmp = document.getElementById("btn-jump");

        // İleri Butonu (Basılı tutuldukça gider)
        btnFwd.addEventListener("pointerdown", () => moveForward = true);
        btnFwd.addEventListener("pointerup", () => moveForward = false);
        btnFwd.addEventListener("pointerleave", () => moveForward = false);

        // Zıplama Butonu (Basınca zıplar)
        btnJmp.addEventListener("pointerdown", () => {
            if (isGrounded) {
                velocityY = jumpPower; // Zıplama gücünü uygula
                isGrounded = false;
            }
        });

        // Klavye desteği (PC için)
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
            if(e.code === 'Space' && isGrounded) { velocityY = jumpPower; isGrounded = false; }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
        });

        // Pencere Boyutu Değişimi
        function onWindowResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANA OYUN DÖNGÜSÜ (FİZİK VE RENDER) ---
        function animate() {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);

            // 1. Yerçekimi ve Düşme Fiziği
            velocityY += gravity; // Her karede aşağı doğru çekim uygula
            player.position.y += velocityY;

            // Zemin Çarpışma Kontrolü (Karakterin boyu 2 birim, merkezi 1. birimde)
            if (player.position.y <= 1) {
                player.position.y = 1; // Yerin altına düşmesini engelle
                velocityY = 0; // Düşme hızını sıfırla
                isGrounded = true; // Yerde olduğunu onayla
            } else {
                isGrounded = false; // Havadayken
            }

            // 2. İleri Hareket
            if (moveForward) {
                player.translateZ(-moveSpeed); // Kendi ekseninde ileri (Z ekseni eksi yönü)
                // Yürürken küçük bir sallanma efekti (Bobbing)
                if (isGrounded) {
                    player.rotation.z = Math.sin(Date.now() * 0.01) * 0.05;
                }
            } else {
                player.rotation.z = 0; // Durunca dik dur
            }

            // Düşerken Hafif Takla Atma Efekti (Zevk için)
            if (!isGrounded && velocityY < 0) {
                player.rotation.x -= 0.02; // Düşerken öne eğilme
            } else {
                player.rotation.x = 0; // Yere basınca düzel
            }

            // 3. Kamera Takibi
            // Kamerayı oyuncunun arkasında ve biraz yukarısında tut
            const relativeCameraOffset = new THREE.Vector3(0, 4, 8);
            const cameraOffset = relativeCameraOffset.applyMatrix4(player.matrixWorld);
            
            // Kamera yumuşak bir şekilde oyuncuyu takip etsin (Lerp)
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(player.position);

            // Sahneyi Çiz
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
